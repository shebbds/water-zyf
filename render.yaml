# Render Blueprint —— 卫生许可个人业务工作台（纯静态站点）
# 部署方式：把本仓库推到 GitHub/GitLab，在 Render 选择「New + → Blueprint」并连接仓库，
# Render 会自动按此文件创建静态站点。也可在 Render 手动新建 Static Site，
# 发布目录填 ./workbench 即可。
services:
  - name: water-zyf
    type: web                 # 静态站点与 Web 服务都用 web
    runtime: static           # 静态站点运行时
    buildCommand: "echo 'static site, no build needed'"
    staticPublishPath: ./workbench   # 含 index.html / app.js / seed.js 的目录（相对仓库根）
    pullRequestPreviewsEnabled: false
    # 默认会分配 *.onrender.com 的公网 HTTPS 域名，电脑/手机均可直接访问。
    # 如需自定义域名，可在 Render 控制台绑定。
    # 同域代理：把 CloudBase 网关请求(同源的 /cbapi/*)转发到腾讯云，避开免费版
    # CloudBase 无法配置安全域名导致的浏览器跨域预检失败。app.js 的 installCbProxy()
    # 会把 https://<环境>.<地域>.tcb-api.tencentcloudapi.com/* 改写成 /cbapi/*。
    # ⚠️ 若换 CloudBase 环境/地域，这里的目标地址也要同步改。
    routes:
      - type: rewrite
        source: /cbapi/*
        destination: https://water309-d8g1c3uy074511212.ap-shanghai.tcb-api.tencentcloudapi.com/*
